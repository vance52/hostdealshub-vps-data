name: Refresh verified snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync and export
        run: |
          python scripts/sync_snapshot.py
          python scripts/export_snapshot.py
          python -m unittest discover -s tests
          git diff --check
      - name: Commit a changed snapshot
        run: |
          if git diff --quiet; then
            echo "No snapshot change."
            exit 0
          fi
          git config user.name "hostdealshub data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/vps_offers.csv data/providers.md
          git commit -m "data: refresh verified VPS snapshot"
          git push
